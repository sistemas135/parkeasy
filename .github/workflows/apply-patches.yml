name: apply-patches
on:
  push:
    branches: [main]
    paths: ['patches/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parches y publicar
        run: |
          set -e
          for p in $(ls patches/*.patch | sort); do echo "== $p"; git apply --whitespace=nowarn "$p"; done
          git rm -q patches/*.patch
          git config user.name "parkeasy-bot"
          git config user.email "parkeasy-bot@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar parches [skip ci]"
          git push
